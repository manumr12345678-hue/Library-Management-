<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<title>Library Management Login</title>
</head>
<body>

<div class="container">
  <h1 class="title">LIBRARY MANAGEMENT</h1>

  <div class="login-box">
    <h2 class="login-text">LOGIN</h2>
    
    <div class="input-group">
      <label for="collegeName">College Name</label>
      <input type="text" id="collegeName" placeholder="Enter college name" required>
    </div>

    <div class="input-group password-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="button" class="toggle-password">👁</button>
      </div>
    </div>

    <div class="options">
      <a href="register.html" class="new-user">New user?</a>
    </div>

    <button type="button" id="loginBtn" class="login-btn">Login</button>

 
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
