<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Library Management Register</title>
</head>
<body>

<div class="container">
  <h1 class="title">LIBRARY MANAGEMENT</h1>

  <div class="login-box">
    <h2 class="login-text">REGISTER</h2>
    
    <div class="input-group">
      <label for="collegeName">College Name</label>
      <input type="text" id="collegeName" placeholder="Enter college name" required>
    </div>

    <div class="input-group password-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
      </div>
    </div>

    <div class="options">
      <a href="login.html" class="new-user">Already Have An Account?</a>
    </div>

    <button type="button" class="login-btn" onclick="registerUser()">Register</button>
  </div>
</div>

<!-- Only one script, type="module" -->
<script type="module" src="script.js"></script>

</body>
</html>
